<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <div class="min-h-[884px] w-full max-w-md mx-auto px-gutter-md py-gutter-lg flex flex-col justify-between gap-gutter-lg bg-light-surface" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Top Context Header: Place + Character + Timer -->
    <header class="flex items-center justify-between gap-gutter-sm pb-gutter-sm border-b border-light-outline-variant">
      <div class="flex items-center gap-gutter-sm">
        <span data-component-id="badge-status" data-component-type="badge" data-component-variant="status" role="status" class="inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-xs rounded-full bg-meera-forest text-light-on-primary">
          <span class="material-symbols-outlined text-body-md" aria-hidden="true">visibility</span>
          <span class="font-label text-label-sm" data-design-text-token="label-sm">Meera · Adilabad</span>
        </span>
      </div>
      <span class="font-mono text-mono-md text-light-on-surface-variant tabular-nums" data-design-text-token="mono-md">00:18</span>
    </header>

    <!-- Main Voting Stage (P4 Single Choice) -->
    <main id="vote-stage" class="flex-1 flex flex-col justify-center gap-gutter-lg">
      <div class="flex flex-col gap-gutter-xs">
        <span class="font-mono text-mono-md text-meera-forest uppercase" data-design-text-token="mono-md">Question 2 of 7</span>
        <h1 class="font-headline text-headline-lg-mobile text-light-on-surface text-balance" data-design-text-token="headline-lg-mobile">
          AI says the next attacks will be in three villages. What do you do?
        </h1>
      </div>

      <!-- 4 Large Option Buttons -->
      <div class="flex flex-col gap-gutter-md" role="radiogroup" aria-label="Question 2 options">
        <button type="button" onclick="castVote(&#39;Act on it now&#39;)" data-component-id="card-interactive-2" data-component-type="card" data-component-variant="interactive" class="w-full text-left p-gutter-lg rounded-lg bg-light-surface-container-lowest border-2 border-light-outline-variant hover:border-meera-forest active:scale-[0.99] transition-all duration-state-change ease-state-change flex items-center justify-between gap-gutter-md">
          <span class="font-title text-title-md text-light-on-surface" data-design-text-token="title-md">Act on it now</span>
          <span class="material-symbols-outlined text-light-outline shrink-0" aria-hidden="true">chevron_right</span>
        </button>

        <button type="button" onclick="castVote(&#34;Check it against Meera&#39;s field knowledge&#34;)" data-component-id="card-interactive-2" data-component-type="card" data-component-variant="interactive" class="w-full text-left p-gutter-lg rounded-lg bg-light-surface-container-lowest border-2 border-light-outline-variant hover:border-meera-forest active:scale-[0.99] transition-all duration-state-change ease-state-change flex items-center justify-between gap-gutter-md">
          <span class="font-title text-title-md text-light-on-surface" data-design-text-token="title-md">Check it against Meera&#39;s field knowledge</span>
          <span class="material-symbols-outlined text-light-outline shrink-0" aria-hidden="true">chevron_right</span>
        </button>

        <button type="button" onclick="castVote(&#39;Send it straight to the villagers&#39;)" data-component-id="card-interactive-2" data-component-type="card" data-component-variant="interactive" class="w-full text-left p-gutter-lg rounded-lg bg-light-surface-container-lowest border-2 border-light-outline-variant hover:border-meera-forest active:scale-[0.99] transition-all duration-state-change ease-state-change flex items-center justify-between gap-gutter-md">
          <span class="font-title text-title-md text-light-on-surface" data-design-text-token="title-md">Send it straight to the villagers</span>
          <span class="material-symbols-outlined text-light-outline shrink-0" aria-hidden="true">chevron_right</span>
        </button>

        <button type="button" onclick="castVote(&#34;Ignore it; AI can&#39;t know a forest&#34;)" data-component-id="card-interactive-2" data-component-type="card" data-component-variant="interactive" class="w-full text-left p-gutter-lg rounded-lg bg-light-surface-container-lowest border-2 border-light-outline-variant hover:border-meera-forest active:scale-[0.99] transition-all duration-state-change ease-state-change flex items-center justify-between gap-gutter-md">
          <span class="font-title text-title-md text-light-on-surface" data-design-text-token="title-md">Ignore it; AI can&#39;t know a forest</span>
          <span class="material-symbols-outlined text-light-outline shrink-0" aria-hidden="true">chevron_right</span>
        </button>
      </div>
    </main>

    <!-- Voted Confirmation State (P6 Voted — hidden until tapped) -->
    <main id="voted-stage" class="hidden flex-1 flex flex-col justify-center gap-gutter-lg">
      <div class="p-gutter-lg rounded-xl bg-light-surface-container-low border border-light-outline-variant flex flex-col items-center text-center gap-gutter-md">
        <span class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-meera-forest text-light-on-primary">
          <span class="material-symbols-outlined text-headline-md" aria-hidden="true">check</span>
        </span>
        <div class="flex flex-col gap-gutter-xs">
          <h2 class="font-headline text-headline-lg-mobile text-light-on-surface" data-design-text-token="headline-lg-mobile">You&#39;re in. Watch the screen.</h2>
          <p id="chosen-label" class="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md"></p>
        </div>
      </div>

      <button type="button" onclick="resetVote()" data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" class="w-full py-gutter-md rounded-md bg-light-surface-container-low text-light-on-surface border border-light-outline-variant font-label text-label-lg">
        <span data-design-text-token="label-lg">Change my pick</span>
      </button>
    </main>

    <!-- Footer: Quest Reminder -->
    <footer class="pt-gutter-sm border-t border-light-outline-variant flex items-center justify-between">
      <span class="font-label text-label-sm text-light-on-surface-variant" data-design-text-token="label-sm">The Ride · Tech4Good</span>
      <span class="font-mono text-mono-md text-light-on-surface-variant tabular-nums" data-design-text-token="mono-md">870 / 2,100 km</span>
    </footer>
  </div>

  <script>
    function castVote(label) {
      document.getElementById('vote-stage').classList.add('hidden');
      document.getElementById('voted-stage').classList.remove('hidden');
      document.getElementById('chosen-label').textContent = 'Your pick: ' + label;
    }
    function resetVote() {
      document.getElementById('voted-stage').classList.add('hidden');
      document.getElementById('vote-stage').classList.remove('hidden');
    }
  </script>


</body></html>
