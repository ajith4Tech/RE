<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>The Ride · Tech4Good</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/presenter.css" />
</head>
<body class="presenter">
  <div id="viewport">
    <div id="stage" class="band-tall">
      <!-- What's on screen: where we are (top left), the game strip (top right), the scene, the road band.
           Presenter controls live in the moderator view (/moderator) and on the keyboard, never here. -->
      <header id="hud">
        <div class="where" id="hudWhere"></div>
        <div class="strip" id="strip">
          <div class="pill-stat hidden" id="qnum"></div>
          <div class="gauge" id="fuel" role="img" aria-label="Fuel 50%">
            <svg viewBox="0 0 64 38" aria-hidden="true"><path class="g-track" d="M7 33 A25 25 0 0 1 57 33" /><path class="g-fill" id="gFill" pathLength="100" d="M7 33 A25 25 0 0 1 57 33" /></svg>
            <span class="g-read">Fuel <b id="fuelPct">50%</b></span>
          </div>
          <div class="pill-stat hidden" id="players"><b id="playersN">0</b> <span>riders joined</span></div>
          <div class="pill-stat hidden" id="answers"><b id="ansCount">0</b> <span>answers</span></div>
          <div class="host-badge hidden" id="modeBadge">Host mode</div>
          <div class="fuel-note" id="fuelDelta" aria-live="polite"></div>
        </div>
      </header>

      <main id="scene"></main>

      <div id="bandWrap"><svg id="band" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg></div>
      <!-- The bike rides in its own unclipped layer above the band, so the rider is never cut off -->
      <svg id="bikeLayerSvg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>

      <div id="qrCard" class="qr-card hidden">
        <div class="qr" id="qrSmall"></div>
        <div><b>Scan to vote</b><span id="qrUrl"></span></div>
      </div>

      <div id="toast" class="toast" role="status"></div>
      <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-box" id="modalBox"></div></div>
    </div>
  </div>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/presenter.js"></script>
</body>
</html>
