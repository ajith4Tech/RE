<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>The Ride · Tech4Good</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/presenter.css" />
</head>
<body class="presenter">
  <div id="viewport">
    <!-- A fixed 16:9 stage on the Stitch 1440×810 grid, scaled to the window (1920×1080 on a 1080p projector).
         The presenter runs everything from here: the dock (mouse) or the keyboard / a clicker. -->
    <div id="stage" data-p="crew">
      <div id="backdrop" aria-hidden="true"></div>
      <header id="hud"></header>
      <main id="main"></main>
      <section id="road" aria-hidden="true">
        <!-- The verge (roadside in the scene's ground colour) bridges the backdrop and the asphalt -->
        <div id="lane"><div id="verge"></div><div id="convoy"></div><div id="sign"></div><div id="detour"></div></div>
        <div id="strip"><i></i></div>
        <footer id="foot"><div id="route"></div></footer>
      </section>
      <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-box" id="modalBox"></div></div>
    </div>
    <!-- The presenter's dock: appears on mouse move, hides itself (and the cursor) after a few seconds -->
    <div id="dock" aria-label="Presenter controls"></div>
  </div>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/presenter.js"></script>
</body>
</html>
