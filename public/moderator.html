<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1a10" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%232a1a10'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23f0b42f'%3EM%3C/text%3E%3C/svg%3E" />
  <title>The Ride: Moderator</title>
  <link rel="stylesheet" href="/css/fonts-intl.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    body { background: var(--sky); font-size: 18px; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: var(--green); color: var(--chalk); position: sticky; top: 0; z-index: 2; box-shadow: inset 0 -4px 0 var(--chalk); }
    header b { font: 800 24px var(--sign); text-transform: uppercase; letter-spacing: .04em; }
    .src { font: 700 14px var(--body); padding: 4px 10px; border: 2px solid var(--chalk); }
    .src.ok { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
    main { max-width: 780px; margin: 0 auto; padding: 16px; }
    .gate { max-width: 440px; margin: 10vh auto 0; background: var(--chalk); border: 4px solid var(--ink); padding: 24px; }
    .gate h1 { font: 800 34px var(--sign); text-transform: uppercase; margin: 0 0 8px; }
    .gate label { font-weight: 700; display: block; margin-top: 8px; }
    .gate input { width: 100%; font: 700 30px var(--body); padding: 10px 14px; border: 3px solid var(--ink); margin: 6px 0 10px; min-height: 56px; }
    .gate button, .btn { font: 800 20px var(--sign); text-transform: uppercase; letter-spacing: .04em; min-height: 48px; padding: 10px 18px; border: 3px solid var(--ink); background: var(--green); color: var(--chalk); cursor: pointer; }
    .btn.sec { background: var(--chalk); color: var(--ink); }
    .btn.ok { background: var(--green); }
    .btn.no { background: var(--red); }
    .err { color: var(--red); font-weight: 700; min-height: 24px; }
    .where { font: 700 16px var(--sign); text-transform: uppercase; letter-spacing: .08em; color: var(--red); margin: 0; }
    h1 { font: 800 32px/1.1 var(--sign); margin: 4px 0 8px; }
    .phase { display: inline-block; font: 700 15px var(--body); padding: 3px 10px; background: var(--ink); color: var(--yellow); }
    .card { background: var(--chalk); border: 3px solid var(--ink); padding: 12px 16px; margin-top: 14px; }
    .card.key { border-left: 12px solid var(--yellow); }
    .card h2 { margin: 0 0 6px; font: 800 16px var(--sign); text-transform: uppercase; letter-spacing: .1em; }
    .card h3 { font: 800 18px var(--sign); text-transform: uppercase; margin: 12px 0 6px; }
    .card p { margin: 0; line-height: 1.45; }
    .answer { font: 700 21px/1.4 var(--body); }
    ul, ol { margin: 6px 0 0; padding-left: 22px; } li { margin: 6px 0; line-height: 1.4; }
    .queue { list-style: none; padding: 0; } .queue li { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 1px solid #BDB4A3; padding: 6px 0; }
    .queue .w { font: 700 20px var(--body); flex: 1; min-width: 0; } .qbtns { display: flex; gap: 6px; flex: none; }
    .ptag { flex: none; font: 800 14px/1 var(--sign); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px 4px; color: var(--chalk); margin-inline-end: 8px; }
    .ptag.green { background: var(--green); } .ptag.red { background: var(--red); }
    .timer { text-align: center; } .tnum { font: 800 76px/1 var(--sign); margin: 6px 0 10px; }
    .trow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .note { font-size: 15px; color: var(--ink-2); margin-top: 8px !important; }
    .stat { font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <b>The Ride · Moderator</b>
    <span class="src" id="src">Not connected</span>
  </header>
  <main id="app"></main>
  <script type="module" src="/js/moderator.js"></script>
</body>
</html>
