<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F5A3D" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 60V26a24 24 0 0 1 48 0v34z' fill='%23F5F1E6' stroke='%231A1A1A' stroke-width='4'/%3E%3Cpath d='M8 26a24 24 0 0 1 48 0z' fill='%23F2C230' stroke='%231A1A1A' stroke-width='4'/%3E%3C/svg%3E" />
  <title>The Ride: Vote</title>
  <link rel="stylesheet" href="/css/fonts-intl.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/vote.css" />
</head>
<body class="voter">
  <a class="skip" href="#app">Skip to the question</a>
  <header class="v-head">
    <span class="v-brand">The Ride</span>
    <span class="v-conn" id="conn" role="status"><span class="dot" aria-hidden="true"></span><span id="connText"></span></span>
    <button class="v-globe" id="langBtn" type="button" aria-label="Change language">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 12h20M12 2c3 3 4.5 6.5 4.5 10S15 19 12 22M12 2C9 5 7.5 8.5 7.5 12S9 19 12 22" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </header>
  <div class="road-strip hidden" id="road"></div>
  <main id="app" tabindex="-1"></main>
  <div class="sr-only" id="announce" role="status" aria-live="polite"></div>
  <footer class="v-foot" id="foot">Anonymous voting. No names, no sign-up, no personal data.</footer>
  <script type="module" src="/js/vote.js"></script>
</body>
</html>
